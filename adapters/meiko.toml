## meiko.studio — the few things about the site the extension still has to be told.
##
## This file is DATA on purpose. When the site moves a button you edit a line here and
## reload the page; no code change, no extension reload. The extension fetches it from the
## app at GET /api/posting/adapter, and the app reads [site] itself when it builds a plan.
##
## It used to describe the whole posting flow — the Details form, the page editor, the
## back arrow — because posting meant driving that form field by field. It does not any
## more: meiko is a Nuxt front end over an API at hirayatales.com/app/chapter, and the
## extension calls that directly (POST to create, PUT to configure and fill). Everything
## the form path needed was removed along with the code that read it; git history has it
## if the API ever changes shape.
##
## What is left is read by live code:
##   [site]          the app, when planning a run
##   [chapter_list]  scraped read-only before a run, as a duplicate guard
##   [create]        the dialog probe in the extension's panel
##
## Locators are matched by VISIBLE TEXT wherever possible, because text is what survives a
## redesign. This site is built with Tailwind and Headless UI, so its class names are
## generated (`focus-visible:outline-0`) and its element ids carry a per-render random
## suffix (`headlessui-switch-nidk7BJvxkY_313`) — neither is safe to target. Give `css`
## only where the structure is stable, like a table cell position.
##
## One standing rule, enforced by the code simply never looking for it: the robot does not
## press "Send Notification". Posting a batch would otherwise fire one reader alert per
## chapter; the user notifies people themselves.

[site]
name = "meiko"
label = "meiko.studio"
url_pattern = '^https://meiko\.studio/page/[^/]+/series/[^/]+/?'
# Confirmed: the editor reports "0 / 100000". A guard only — the longest of 2,641 real
# chapters is 25,434 characters.
max_chars = 100000
title_template = "Chapter {n}"
side_title_template = "Side Stories {n}"

## ---------------------------------------------------------------------------
## The series landing page, listing every chapter already posted.
## Scraped read-only before a run: the live list is a better duplicate guard than our own
## ledger, because it also catches anything posted by hand. It is also where the coin price
## is read from, so the app can offer the site's own number rather than have it typed.
##
## Confirmed shape, one row per chapter, newest first:
##   ["Chapter 61 55", "3", "Public"]
## Cell 1 holds the name AND the coin badge, run together in the text. Cell 4 holds the
## coin <input> (or the word "Free"), so the price is read from there and then removed from
## the end of cell 1 — parsing "Chapter 61 55" by splitting off a trailing number would
## turn "Side Stories 1" into "Side Stories" priced at 1.
[chapter_list]
row_css = "tbody tr"
name_css = "td:nth-child(1)"
views_css = "td:nth-child(2)"
state_css = "td:nth-child(3)"
paid_css = "td:nth-child(4)"
coins_input_css = 'input[placeholder="Coins"]'
# Each row carries two Headless UI switches, in this order: State, then Paid. Targeted by
# role within the row — never by id.
row_switch_css = '[role="switch"]'

## ---------------------------------------------------------------------------
## Opening the "Create Chapter" dialog. Used only by the panel's dialog probe now, which
## opens it and submits nothing — the real path creates chapters through the API.
##
## Two buttons carry this label (sidebar and header), so the extension tries each rather
## than trusting DOM order; the sidebar one is what opens the dialog.
##
## Two things learned the hard way. `el.click()` alone does nothing — the handler is not on
## `click`, so the whole pointer/mouse sequence has to be dispatched. And the button reports
## `disabled=true` shortly after the page settles; a synthetic event reaches a disabled
## element's listeners anyway, which is why it opened at all, so the extension waits for it
## to enable rather than relying on that.
##
## The dialog's name box has NO placeholder and no stable id, so there is nothing here to
## select on. It is found structurally instead — the text box that appeared inside the modal
## and was not on the page beforehand — which is what `findNameBox` does, and why this
## section carries no CSS.
[create]
text = "Create"
